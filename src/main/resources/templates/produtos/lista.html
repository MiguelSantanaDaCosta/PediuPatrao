<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Produtos</title>
  </head>
  <body>
    <div th:fragment="content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
          <i class="bi bi-box-seam me-2 text-primary"></i>Produtos
        </h2>
        <button
          th:if="${isGerenteOrAdmin == true}"
          class="btn btn-primary"
          data-bs-toggle="collapse"
          data-bs-target="#formularioProduto"
        >
          <i class="bi bi-plus-lg me-1"></i>Novo Produto
        </button>
      </div>

      <div
        class="alert alert-success alert-dismissible fade show"
        th:if="${sucesso}"
        role="alert"
      >
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
        ></button>
      </div>
      <div
        class="alert alert-danger alert-dismissible fade show"
        th:if="${erro}"
        role="alert"
      >
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
        ></button>
      </div>

      <!-- Formulário (colapsável) -->
      <div
        th:if="${isGerenteOrAdmin == true}"
        class="collapse mb-3"
        id="formularioProduto"
      >
        <div class="card card-body shadow-sm">
          <h5 class="card-title mb-3">
            <i class="bi bi-plus-circle me-1"></i>Cadastrar Produto
          </h5>
          <form id="produtoForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="nome" class="form-label">Nome</label>
                <input
                  type="text"
                  id="nome"
                  class="form-control"
                  required
                  maxlength="120"
                />
              </div>
              <div class="col-md-3">
                <label for="tipo" class="form-label">Tipo</label>
                <select id="tipo" class="form-select" required>
                  <option value="" disabled selected>Selecione</option>
                  <option value="Pizza">Pizza</option>
                  <option value="Lanche">Lanche</option>
                  <option value="Bebida">Bebida</option>
                  <option value="Porção">Porção</option>
                  <option value="Adicional">Adicional</option>
                </select>
              </div>
              <div class="col-md-3">
                <label for="preco" class="form-label">Preço (R$)</label>
                <input
                  type="number"
                  id="preco"
                  class="form-control"
                  step="0.01"
                  min="0.01"
                  required
                />
              </div>
              <div class="col-12">
                <div class="form-check">
                  <input
                    type="checkbox"
                    id="ativo"
                    class="form-check-input"
                    checked
                  />
                  <label for="ativo" class="form-check-label">Ativo</label>
                </div>
              </div>
              <div class="col-12 text-end">
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-toggle="collapse"
                  data-bs-target="#formularioProduto"
                >
                  Cancelar
                </button>
                <button type="submit" class="btn btn-success">
                  <i class="bi bi-check-lg me-1"></i>Salvar
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- Lista -->
      <div class="card shadow-sm">
        <div class="card-body p-0">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th class="ps-4">ID</th>
                <th>Nome</th>
                <th>Tipo</th>
                <th class="text-end">Preço</th>
                <th class="text-center">Ativo</th>
                <th class="text-center">Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(produtos)}">
                <td colspan="6" class="text-center text-muted py-5">
                  <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                  Nenhum produto cadastrado.
                </td>
              </tr>
              <tr th:each="produto : ${produtos}">
                <td
                  class="ps-4 text-muted small"
                  th:text="${#strings.abbreviate(produto.id, 8)}"
                ></td>
                <td th:text="${produto.nome}"></td>
                <td>
                  <span
                    class="badge bg-secondary"
                    th:text="${produto.tipo}"
                  ></span>
                </td>
                <td
                  class="text-end"
                  th:text="'R$ ' + ${#numbers.formatDecimal(produto.preco, 1, 'COMMA', 2, 'POINT')}"
                ></td>
                <td class="text-center">
                  <span
                    class="badge"
                    th:classappend="${produto.ativo} ? 'bg-success' : 'bg-secondary'"
                    th:text="${produto.ativo ? 'Sim' : 'Não'}"
                  ></span>
                </td>
                <td class="text-center">
                  <button
                    th:if="${isGerenteOrAdmin == true}"
                    class="btn btn-sm btn-outline-danger"
                    th:attr="data-produto-id=${produto.id}"
                    onclick="excluirProduto(this)"
                    title="Excluir"
                  >
                    <i class="bi bi-trash"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div
          class="card-footer text-muted small"
          th:if="${!#lists.isEmpty(produtos)}"
        >
          Total: <strong th:text="${#lists.size(produtos)}"></strong> produto(s)
        </div>
      </div>

      <script>
        const produtoForm = document.getElementById("produtoForm");
        if (produtoForm) {
          produtoForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const payload = {
              nome: document.getElementById("nome").value,
              tipo: document.getElementById("tipo").value,
              preco: parseFloat(document.getElementById("preco").value),
              ativo: document.getElementById("ativo").checked,
            };
            try {
              const resp = await fetch("/api/produtos", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Accept: "application/json",
                },
                body: JSON.stringify(payload),
              });
              if (!resp.ok) {
                const erro = await resp.json().catch(() => ({}));
                alert("Erro: " + (erro.mensagem || resp.status));
                return;
              }
              location.reload();
            } catch (e) {
              alert("Falha na comunicação: " + e.message);
            }
          });
        }

        async function excluirProduto(btn) {
          const id = btn.getAttribute("data-produto-id");
          if (!confirm("Excluir este produto?")) return;
          try {
            const resp = await fetch("/api/produtos/" + id, {
              method: "DELETE",
            });
            if (!resp.ok) {
              const erro = await resp.json().catch(() => ({}));
              alert("Erro: " + (erro.mensagem || resp.status));
              return;
            }
            location.reload();
          } catch (e) {
            alert("Falha na comunicação: " + e.message);
          }
        }
      </script>
    </div>
  </body>
</html>
