<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PediuPatrão</title>
    <link
      rel="stylesheet"
      th:href="@{/plugins/fontawesome-free/css/all.min.css}"
    />
    <link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body class="hold-transition sidebar-mini layout-fixed">
    <div class="wrapper">
      <!-- Navbar -->
      <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" data-widget="pushmenu" href="#" role="button">
              <i class="fas fa-bars"></i>
            </a>
          </li>
        </ul>
        <ul class="navbar-nav ml-auto">
          <li class="nav-item" th:if="${usuarioLogado != null}">
            <span class="nav-link">
              <i class="fas fa-user"></i>
              <span th:text="${usuarioLogado}">usuário</span>
              <span
                th:if="${perfilLogado != null}"
                th:text="' (' + ${perfilLogado} + ')'"
              ></span>
            </span>
          </li>
          <li class="nav-item" th:if="${usuarioLogado != null}">
            <form
              th:action="@{/logout}"
              method="post"
              class="form-inline d-inline"
            >
              <button
                type="submit"
                class="btn btn-link nav-link border-0 bg-transparent"
              >
                <i class="fas fa-sign-out-alt"></i> Sair
              </button>
            </form>
          </li>
        </ul>
      </nav>

      <!-- Sidebar (inline, evita dependência de fragmento externo) -->
      <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <a th:href="@{/}" class="brand-link">
          <span class="brand-text font-weight-light">PediuPatrão</span>
        </a>
        <div class="sidebar">
          <nav class="mt-2">
            <ul
              class="nav nav-pills nav-sidebar flex-column"
              data-widget="treeview"
              role="menu"
              data-accordion="false"
            >
              <li class="nav-item">
                <a th:href="@{/}" class="nav-link">
                  <i class="nav-icon fas fa-home"></i>
                  <p>Início</p>
                </a>
              </li>
              <li class="nav-item">
                <a th:href="@{/clientes}" class="nav-link">
                  <i class="nav-icon fas fa-users"></i>
                  <p>Clientes</p>
                </a>
              </li>
              <li class="nav-item">
                <a th:href="@{/pedidos}" class="nav-link">
                  <i class="nav-icon fas fa-shopping-cart"></i>
                  <p>Pedidos</p>
                </a>
              </li>
              <li class="nav-item">
                <a th:href="@{/produtos}" class="nav-link">
                  <i class="nav-icon fas fa-pizza-slice"></i>
                  <p>Produtos</p>
                </a>
              </li>
              <li class="nav-item" th:if="${isAdmin}">
                <a th:href="@{/usuarios}" class="nav-link">
                  <i class="nav-icon fas fa-user-cog"></i>
                  <p>Usuários</p>
                </a>
              </li>
              <li class="nav-item" th:if="${isGerenteOrAdmin}">
                <a th:href="@{/auditoria}" class="nav-link">
                  <i class="nav-icon fas fa-clipboard-list"></i>
                  <p>Auditoria</p>
                </a>
              </li>
              <li class="nav-item" th:if="${isAdmin}">
                <a th:href="@{/configuracoes}" class="nav-link">
                  <i class="nav-icon fas fa-cog"></i>
                  <p>Configurações</p>
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </aside>

      <!-- Conteúdo: cada template injeta seu fragmento "content" -->
      <div class="content-wrapper">
        <section class="content pt-3">
          <div class="container-fluid">
            <div th:replace="~{__${content}__}"></div>
          </div>
        </section>
      </div>

      <footer class="main-footer">
        <div class="float-right d-none d-sm-inline">PediuPatrão</div>
        <strong
          >&copy; <span th:text="${anoAtual}">2026</span> PediuPatrão.</strong
        >
      </footer>
    </div>

    <script th:src="@{/plugins/jquery/jquery.min.js}"></script>
    <script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/dist/js/adminlte.min.js}"></script>
  </body>
</html>
