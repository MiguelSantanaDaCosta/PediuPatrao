# Perfil ativo vindo do .env (fallback: "local")
spring.profiles.active=${APP_PROFILE:local}

# MongoDB — lê do .env. Se não existir, cai no default localhost
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/pizzaria}

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Log
logging.level.com.umc.pediupatrao=DEBUG
